# Digital-human platform: the registry, runtime, tools, and scheduler.
# The digital humans themselves are data (see <home>/humans.json), not rows here.
- insert:
    - id: digital-human
      name: '@harrywan/dsh-digital-human'
      config:
        # Omit `home` to use ~/.dsh/digital-human.
        # A fresh install starts empty: configure a digital human in the page, or
        # import one. Seeding shipped two business personas, which is not the
        # plugin's business to decide.
        seed: false
